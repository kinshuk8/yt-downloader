# Builds the Windows installer on GitHub's Windows machines.
# - Publishing a release attaches Snag-Setup.exe (plus notices and sources) to it.
# - "Run workflow" on the Actions tab builds one to download from the run's artifacts.
name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: bash
        env:
          SNAG_VERSION: ${{ github.event.release.tag_name || '0.0.0' }}
        run: ./build-windows.sh

      - name: Smoke test (install, open, screenshot, uninstall)
        shell: pwsh
        run: |
          Start-Process dist\Snag-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Snag"
          if (-not (Test-Path "$app\Snag.exe")) { throw "Snag.exe was not installed" }
          $p = Start-Process "$app\Snag.exe" -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { throw "Snag exited right after starting (code $($p.ExitCode))" }
          "Window title: '$($p.MainWindowTitle)'"
          New-Item -ItemType Directory -Force smoke | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke\screenshot.png")
          Stop-Process -Id $p.Id -Force
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT' -Wait

      - uses: actions/upload-artifact@v4
        with:
          name: snag-windows
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshot
          path: smoke/
          if-no-files-found: ignore

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}" --clobber
          dist/Snag-Setup.exe dist/THIRD-PARTY-NOTICES-windows.txt dist/snag-windows-third-party-sources.tar.gz
