# Builds the Windows installer on GitHub's Windows machines.
# - Publishing a release attaches Snag-Setup.exe (plus notices and sources) to it.
# - "Run workflow" on the Actions tab builds one to download from the run's artifacts.
name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [windows-build]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: bash
        env:
          SNAG_VERSION: ${{ github.event.release.tag_name || '0.0.0' }}
        run: ./build-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: snag-windows
          path: dist/

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}" --clobber
          dist/Snag-Setup.exe dist/THIRD-PARTY-NOTICES-windows.txt dist/snag-windows-third-party-sources.tar.gz
